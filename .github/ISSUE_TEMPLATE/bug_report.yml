name: Bug report
description: Report a crash, wrong result, or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Please export diagnostics from the app first:**
        Settings → Support → Report a bug → Copy (or Share), then paste below.

        The report is built on-device and **never** includes passwords, keys,
        file contents, or full file paths.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Clear description of the bug.
      placeholder: Encryption of a large PDF failed after ~40% with a notification error…
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps someone else can follow.
      placeholder: |
        1. Open Encrypt tab
        2. Select a 2 GB .zip
        3. Choose Strong method + secure delete
        4. Start and wait
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Encryption
        - Decryption
        - Background / notifications
        - File browser / permissions
        - App lock / biometrics
        - History
        - UI / theme / language
        - Settings
        - Other
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Always
        - Often
        - Sometimes
        - Only once
        - Only after update
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report (from the app)
      description: Paste the full report. If you could not export it, write why.
      render: markdown
      placeholder: |
        # Obfs Encrypt Bug Report
        …
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include passwords, keyfiles, or sensitive file names in free text.
          required: true
        - label: I understand this issue may be public.
          required: true
